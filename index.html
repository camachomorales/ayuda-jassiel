<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Necesitamos ayuda para una cirugía</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff5f5, #ffe4e6);
      color: #2d1b1e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: white;
      border-radius: 24px;
      padding: 42px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(120, 40, 55, .16);
    }
    .heart {
      font-size: 54px;
      margin-bottom: 16px;
      animation: pulse 1.6s infinite;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 1.1;
      color: #b4233c;
      margin-bottom: 18px;
    }
    .name {
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 700;
      color: #3b2529;
      margin-bottom: 22px;
    }
    .message {
      font-size: 1.08rem;
      line-height: 1.7;
      color: #62484d;
      margin: 0 auto 28px;
      max-width: 560px;
    }
    .button {
      border: 0;
      background: #b4233c;
      color: white;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    .button:hover { background: #951d32; transform: translateY(-2px); }
    .button:active { transform: scale(.97); }
    #thanks {
      margin-top: 18px;
      min-height: 24px;
      font-weight: 700;
      color: #b4233c;
    }
    footer {
      margin-top: 28px;
      font-size: .85rem;
      color: #8b6e73;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">❤️</div>

    <h1>Necesitamos ayuda para una cirugía</h1>

    <div class="name">Jassiel Camacho Morales</div>

    <p class="message">
      Estamos solicitando apoyo para poder cubrir los gastos relacionados
      con una cirugía. Cualquier ayuda, por pequeña que sea, puede hacer
      una gran diferencia.
    </p>

    <button class="button" id="helpButton">Quiero ayudar</button>
    <div id="thanks" aria-live="polite"></div>

    <footer>Gracias por leer y por compartir esta solicitud.</footer>
  </main>

  <script>
    const button = document.getElementById("helpButton");
    const thanks = document.getElementById("thanks");

    button.addEventListener("click", () => {
      thanks.textContent = "¡Muchas gracias por tu apoyo! ❤️";
      button.textContent = "Gracias";
    });
  </script>
</body>
</html>
